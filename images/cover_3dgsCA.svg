<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="3DGS Competitive Analysis cover">
  <defs>
    <radialGradient id="bg" cx="32%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#224055"/>
      <stop offset="55%" stop-color="#191d20"/>
      <stop offset="100%" stop-color="#101316"/>
    </radialGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC4D2" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#8FC4D2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FC4D2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#8FC4D2" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="0" y1="500" x2="1000" y2="500"/>
    <line x1="0" y1="750" x2="1000" y2="750"/>
    <line x1="250" y1="0" x2="250" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="750" y1="0" x2="750" y2="1000"/>
  </g>

  <!-- soft gaussian splat blobs -->
  <circle cx="360" cy="380" r="180" fill="url(#blob)" filter="url(#soft)"/>
  <circle cx="680" cy="560" r="150" fill="url(#blob)" filter="url(#soft)"/>
  <circle cx="560" cy="240" r="90"  fill="url(#blob)" filter="url(#soft)"/>

  <!-- scattered point cloud -->
